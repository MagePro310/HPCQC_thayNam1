[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hpcqc-demo"
version = "0.1.0"
description = "HPCQC RPC MVP demo with Flask, Streamlit, and a dependency-light QAOA simulator."
requires-python = ">=3.12"
dependencies = [
  "flask",
  "streamlit",
  "numpy",
  "pydantic",
  "requests",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

